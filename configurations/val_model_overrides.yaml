# Test Model Configuration File

# YOLO Model Parameters / Overrides
data: 'configurations/model_data-seg.yaml' # Data Source
split: 'val'              # data is specific to 'val' folder

# Training Model Weights (relative to repo root)
weights: 'runs/segment/train_Yolo11s_canopy_832_adamW__20251101-0151/weights/best.pt' 
    # Weights from Train Model / Modify where necessary


# Hardware
device: 'None'            # 'mps' = Apple Metal GPU | 'None' select best fit given availability
workers: 1                # keep small on macOS/MPS

# Schedule
imgsz: 1024                # image size (default 640)
batch: 1                  # bulletproof when plotting; optional if rect=False

# NMS (used at val/test)
iou: 0.60                 # IoU
conf: 0.30                # Confidence Level Threshold for evaluation to produce PR Curve
max_det: 300              # cap kept detections per image

# Dataloader
rect: True                 # train with mosaic/crop; keep True only for val/test
                            # force letterbox to a single fixed size

save_json: True           # Saves outputs into JSON for analysis
save_conf: True           # Save per-box confidence scores to JSON for further PR curve analysis or post-filtering.
plots: True               # generates/saves plots of predss vs GT, confusion matrices, and PR curves
agnostic_nms: False       # Dont merge across classes

visualize: False          # Visualizes the ground truths, true positives, false positives and false negatives for each image
verbose: True
name: 'val_Yolo11s_canopy_832_adamW_'
project: runs/segment     # Output destination
